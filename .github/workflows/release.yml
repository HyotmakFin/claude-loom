name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            args: ""
          - os: macos-latest
            label: macOS (universal)
            args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci --no-audit --no-fund

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Loom ${{ github.ref_name }}"
          releaseBody: |
            Loom —— Claude Code CLI 的图形外壳（Tauri 2 + React 19）。

            - **Windows**：`.msi` 或 `-setup.exe`（未签名，SmartScreen 可能提示）
            - **macOS**：通用 `.dmg`（未签名，首次打开需右键 → 打开，或执行 `xattr -dr com.apple.quarantine /Applications/Loom.app`）
            - **Linux**：`claude-loom-<版本>-1-x86_64.pkg.tar.zst`，用 `sudo pacman -U` 安装

            使用前需自行安装 `claude` CLI。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
