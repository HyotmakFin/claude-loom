[package]
name = "loom"
version = "0.3.0"
description = "A thin desktop shell for the Claude Code CLI"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "loom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `tauri build` 会自动加上；直接 cargo build 时必须显式开启，
# 否则二进制会去连接 devUrl（localhost:1420）而不是内嵌前端资源。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
which = "7"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
