[package]
name = "loom-backend"
version = "0.5.3"
edition = "2021"

[[bin]]
name = "loom-backend"
path = "src/main.rs"

[dependencies]
tauri = { path = "tauri-shim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "sync", "time", "rt-multi-thread", "macros"] }
which = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
