[package]
name = "tauri"
version = "2.0.0-shim"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tauri-command-shim = { path = "../tauri-shim-macros" }
